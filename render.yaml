databases:
  - name: landing-contacto-db
    plan: free
    databaseName: monou_contacts
    user: monou

services:
  - type: web
    name: landing-contacto-backend
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # --- Email (Resend) ---
      # MAIL_FROM y MAIL_TO se gestionan ÚNICAMENTE desde el Dashboard de
      # Render (no se versionan en el blueprint). Razones:
      #   1. Permiten que el cambio de remitente al verificar dominio
      #      ('onboarding@resend.dev' -> 'contacto@monoulabs.ai') sea
      #      operativo, sin requerir un PR.
      #   2. Evitan que un 'Blueprint Sync' sobrescriba el valor correcto
      #      con un default obsoleto del repo (causa de incidentes pasados).
      #   3. MAIL_TO debe coincidir EXACTAMENTE con el email registrado
      #      en la cuenta Resend mientras no haya dominio verificado;
      #      mantenerlo aquí riesgoso si la cuenta cambia.
      # Valores actuales en producción (Render Dashboard -> Environment):
      #   MAIL_FROM = Monou.gg Landing <onboarding@resend.dev>
      #              (cambiar a contacto@monoulabs.ai cuando se verifique
      #              el dominio en Resend)
      #   MAIL_TO   = rladron@gmail.com
      #              (= email registrado en la cuenta Resend)
      - key: MAIL_FROM
        sync: false
      - key: MAIL_TO
        sync: false
      # CORS estricto a tus dominios de producción. Mantenemos el GitHub Pages
      # 30 días tras el cutover por compatibilidad; después se quita.
      - key: ALLOWED_ORIGIN
        value: "https://monoulabs.ai,https://www.monoulabs.ai,https://rladron-rodia.github.io"
      # API key de Resend → secret en el dashboard de Render
      - key: RESEND_API_KEY
        sync: false
      # Token Bearer para listar contactos vía /api/contacts → secret
      - key: ADMIN_TOKEN
        sync: false
      # --- AWS S3 para upload de imágenes desde admin (v2.7.0) ---
      # AWS_ACCESS_KEY_ID y AWS_SECRET_ACCESS_KEY son del IAM user
      # `monou-landing-prod` con policy mínima:
      #   - s3:PutObject, s3:GetObject, s3:DeleteObject, s3:ListBucket
      #   - solo en arn:aws:s3:::monou-landing-images-prod/*
      # Si las keys se filtran, blast radius = solo ese bucket. Rotar
      # cada 90 días desde IAM Console (revocar la vieja después).
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # Bucket destino para PNG + WebP optimizados
      - key: S3_BUCKET
        value: monou-landing-images-prod
      - key: S3_REGION
        value: us-east-1
      # Postgres → Render lo inyecta automáticamente
      - key: DATABASE_URL
        fromDatabase:
          name: landing-contacto-db
          property: connectionString
